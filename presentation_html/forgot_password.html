<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Hotel - 忘記密碼</title>
    
    <!-- 引用最新版 Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <style>
        /* --- 全局與字體設定 --- */
        :root {
            --theme-bg: #8B7D74;      /* 灰褐色 */
            --theme-primary: #A98E81; /* 暖棕色 */
            --theme-light: #FFFFFF;   /* 白色 */
            --theme-input-bg: #f0f0f0;
            --theme-text: #333;
            --theme-text-light: #666;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--theme-bg);
            padding: 15px; /* 在極小螢幕上提供邊距 */
        }

        /* --- 主要容器樣式 --- */
        .container-box {
            background-color: var(--theme-light);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%; /* 在小螢幕上佔滿寬度 */
            max-width: 450px; /* 在大螢幕上維持固定最大寬度 */
            text-align: left;
            box-sizing: border-box;
        }

        /* --- 標題與文字 --- */
        .container-box h2 {
            margin-top: 5px;
            margin-bottom: 15px;
            font-size: 28px;
            font-weight: bold;
            color: var(--theme-text);
        }

        .container-box p {
            margin-top: 0;
            margin-bottom: 30px;
            color: var(--theme-text-light);
            line-height: 1.6;
        }
        
        /* --- 表單元素 --- */
        .input-field {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            background-color: var(--theme-input-bg);
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--theme-primary);
            box-shadow: 0 0 0 3px rgba(169, 142, 129, 0.25);
        }

        .submit-btn {
            background-color: var(--theme-primary);
            color: var(--theme-light);
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            transition: background-color 0.3s, transform 0.2s;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: #9c7f71; /* 暖棕色的稍深版本 */
            transform: translateY(-2px);
        }
        
        .submit-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* --- 訊息提示框 --- */
        .message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        /* --- 響應式調整 --- */
        /* 小螢幕時，表單元素會自然垂直排列，此處微調 padding */
        @media (max-width: 576px) {
            .container-box {
                padding: 30px 25px;
            }
            .container-box h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container-box">
        <form id="forgotPasswordForm">
            <h2>忘記密碼</h2>
            <p>請輸入您的註冊信箱。如果帳號存在，我們將會寄送一封密碼重設信件給您。</p>
            
            <label for="email" class="visually-hidden">註冊信箱</label>
            <input type="email" id="email" class="input-field" placeholder="輸入您的註冊信箱" required value="leighmingchin@gmail.com">
            
            <button type="submit" class="submit-btn">傳送重設連結</button>
            
            <div id="messageBox" class="alert message" role="alert"></div>
        </form>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function (event) {
            event.preventDefault(); // 防止表單直接提交
            
            const email = document.getElementById('email').value;
            const messageBox = document.getElementById('messageBox');
            const submitButton = this.querySelector('.submit-btn');

            // 禁用按鈕並更新文字，防止重複點擊
            submitButton.disabled = true;
            submitButton.textContent = '處理中...';

            fetch('process_forgot_password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(response => response.json())
            .then(result => {
                messageBox.style.display = 'block'; // 顯示訊息框
                // 根據後端回傳的 success 狀態，設定不同的樣式與訊息
                if (result.success) {
                    messageBox.className = 'alert alert-success message';
                } else {
                    messageBox.className = 'alert alert-danger message';
                }
                messageBox.textContent = result.message;
            })
            .catch(error => {
                // 處理網路或伺服器端未預期的錯誤
                console.error('Error:', error);
                messageBox.style.display = 'block';
                messageBox.className = 'alert alert-danger message';
                messageBox.textContent = '發生網路錯誤，請稍後再試。';
            })
            .finally(() => {
                // 無論成功或失敗，最後都恢復按鈕狀態
                submitButton.disabled = false;
                submitButton.textContent = '傳送重設連結';
            });
        });
    </script>
    
    <!-- 引用 Bootstrap JS Bundle (包含 Popper.js) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
