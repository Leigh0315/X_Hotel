<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Hotel - 登入</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
       
        body,
        html {
            height: 100%;
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #8B7D74;
        }

        .login-container {
            background-color: white;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: left;
        }

        .login-container h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }

        .login-container h1 a {
            text-decoration: none;
            color: black;
        }

        .login-container h2 {
            margin-top: 5px;
            font-size: 32px;
            font-weight: bold;
        }

        .login-container p {
            margin-top: 10px;
            margin-bottom: 30px;
            color: #666;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            background-color: #f0f0f0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .form-footer a,
        .form-footer .link-style {
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .form-footer a:hover,
        .form-footer .link-style:hover {
            text-decoration: underline;
        }
        
        .submit-btn {
            background-color: #A98E81;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #8B7D74;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <form id="loginForm">
            <h1><a href="./hotel_main.html" style="color: rgba(160, 116, 67, 0.716);">X Hotel</a></h1>
            <h2>登入</h2>
            <p>使用你的X Hotel帳號</p>

            <input type="text" id="username" class="input-field" placeholder="輸入帳號" required value="leighmingchin@gmail.com">
            <input type="password" id="password" class="input-field" placeholder="輸入密碼" required>

            <div class="form-footer">
                <div>
                    <a href="./forgot_password.html">忘記密碼</a>
                </div>
                <div>
                    <a href="./hotel_createA.html" class="link-style">建立新帳號</a>
                    <button type="submit" class="submit-btn" style="margin-left: 15px;">下一步</button>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        // 監聽表單的提交事件
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            // 防止表單的預設送出行為，因為我們要改用 fetch 非同步提交
            event.preventDefault();

            // 獲取使用者輸入的帳號和密碼
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 準備要發送到後端的資料
            const data = {
                username: username,
                password: password
            };

            // 使用 fetch API 將資料以 POST 請求發送到後端 PHP
            fetch('process_login.php', {
                method: 'POST',
                headers: {
                    // 告知後端我們發送的是 JSON 格式的資料
                    'Content-Type': 'application/json'
                },
                // 將 JavaScript 物件轉換為 JSON 字串
                body: JSON.stringify(data)
            })
            .then(response => response.json()) // 解析後端回傳的 JSON 回應
            .then(result => {
                // 根據後端回傳的結果進行處理
                if (result.success) {
                    // 如果成功，顯示成功訊息
                    alert(result.message); 
                    // 在跳轉前，將登入狀態存入 sessionStorage
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('userEmail', username); // 【這就是步驟一要新增的程式碼】
                    // 自動跳轉到 hotel_main.html
                    window.location.href = 'hotel_main.html';
                } else {
                    // 如果不正確，顯示後端傳來的錯誤訊息
                    alert(result.message);
                }
            })
            .catch(error => {
                // 處理網路錯誤或 JSON 解析錯誤
                console.error('Error:', error);
                alert('登入時發生錯誤，請稍後再試。');
            });
        });
    </script>

</body>

</html>
