<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Hotel - 房型介紹</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <style>
        /* 確保內容不會被固定的 navbar 擋住 */
        body {
            padding-top: 80px; 
            background-color: #f8f9fa;
        }

        .btn-outline-brown {
            color: rgba(100, 70, 50, 1);
            border-color: rgba(179, 139, 122, 1);
        }

        .btn-outline-brown:hover,
        .btn-outline-brown:active,
        .btn-outline-brown:focus {
            background-color: rgba(179, 139, 122, 1);
            color: white;
            border-color: rgba(179, 139, 122, 1);
        }
        /* --- Navbar 樣式微調 --- */
        .navbar-brand {
            color: rgba(160, 116, 67, 0.9) !important;
        }
        .nav-link {
            color: #333 !important;
        }
        
        /* --- 房型卡片樣式 --- */
        .room-section {
            padding: 4rem 0;
        }

        .room-card {
            border: none;
            border-radius: 0;
            overflow: hidden; /* 確保圖片不會超出卡片範圍 */
            position: relative;
            color: white;
            height: 450px;
        }
        .room-card .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 讓圖片填滿容器且不變形 */
            transition: transform 0.4s ease;
        }
        .room-card .card-img-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 50%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
            transition: background-color 0.4s ease;
        }
        
        .room-card .select-button {
            background-color: rgba(40, 40, 40, 0.9);
            color: white;
            border: none;
            width: 100%;
            padding: 0.75rem;
            text-align: center;
            text-decoration: none; 
            /* 預設隱藏 */
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        
        .room-card .select-button:hover {
            text-decoration: none;
            color: white;
        }


        /* 當滑鼠懸停或卡片為 active 狀態時的樣式 */
        .room-card:hover .card-img,
        .carousel-item.active .room-card .card-img {
             transform: scale(1.05); /* 圖片放大效果 */
        }
        
        .room-card:hover .card-img-overlay {
            background-color: rgba(0, 0, 0, 0.4);
        }

        .room-card:hover .select-button {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 針對第一張卡片的預設選中狀態 (符合圖片範例) */
        .room-card.default-active .select-button {
            opacity: 1;
            transform: translateY(0);
        }
         .room-card.default-active .card-img-overlay {
            background-color: rgba(0, 0, 0, 0.4);
        }

        .room-title {
            margin-bottom: 0.5rem;
        }

        /* 輪播按鈕樣式 */
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: invert(1) grayscale(100) brightness(2);
        }

    </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
    <div class="container-fluid px-3">

        <a class="navbar-brand fs-4 fw-bold" href="#" style="color: rgba(160, 116, 67, 0.716);">X Hotel</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="../index.html">主頁</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./hotel_facities.html">設施</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./hotel-transport.html">地點與景點</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./hotel_rooms.html">客房</a>
                </li>
            </ul>

            <div id="login-button-container" class="d-flex align-items-center">
                 <a id="login-button" href="./hotel_login.html" class="btn btn-outline-brown ms-lg-3" style="color: black;">會員登入</a>
            </div>
        </div>

        </div>
</nav>

    <section class="room-section">
        <div class="container">
            <h1 class="text-center mb-5 fw-light">房型介紹</h1>

            <div class="row g-4 d-none d-lg-flex">
                <div class="col-lg-3">
                    <div class="card room-card text-white">
                        <img src="../pics_xhotel/尊享客房.png" class="card-img" alt="尊享客房">
                        <div class="card-img-overlay">
                            <h4 class="card-title room-title">尊享客房</h4>
                            <a href="./hotel-booking.html" class="select-button">選擇住宿日期</a>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="card room-card text-white">
                        <img src="../pics_xhotel/豪華客房.png" class="card-img" alt="豪華客房">
                        <div class="card-img-overlay">
                             <h4 class="card-title room-title">豪華客房</h4>
                            <a href="./hotel-booking.html" class="select-button">選擇住宿日期</a>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="card room-card text-white">
                        <img src="../pics_xhotel/總統套房.png" class="card-img" alt="總統套房">
                        <div class="card-img-overlay">
                            <h4 class="card-title room-title">總統套房</h4>
                            <a href="./hotel-booking.html" class="select-button">選擇住宿日期</a>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3">
                    <div class="card room-card text-white">
                        <img src="../pics_xhotel/皇家套房.png" class="card-img" alt="皇家套房">
                        <div class="card-img-overlay">
                           <h4 class="card-title room-title">皇家套房</h4>
                            <a href="./hotel-booking.html" class="select-button">選擇住宿日期</a>
                        </div>
                    </div>
                </div>
            </div>

            <div id="roomCarousel" class="carousel slide d-lg-none" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <div class="card room-card text-white">
                            <img src="../pics_xhotel/尊享客房.png" class="card-img" alt="尊享客房">
                            <div class="card-img-overlay">
                                <h4 class="card-title room-title">尊享客房</h4>
                                <a href="./hotel-booking.html" class="select-button" style="opacity: 1; transform: translateY(0);">選擇住宿日期</a>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="card room-card text-white">
                            <img src="../pics_xhotel/豪華客房.png" class="card-img" alt="豪華客房">
                            <div class="card-img-overlay">
                                <h4 class="card-title room-title">豪華客房</h4>
                                <a href="./hotel-booking.html" class="select-button" style="opacity: 1; transform: translateY(0);">選擇住宿日期</a>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="card room-card text-white">
                            <img src="../pics_xhotel/總統套房.png" class="card-img" alt="總統套房">
                            <div class="card-img-overlay">
                                <h4 class="card-title room-title">總統套房</h4>
                                <a href="./hotel-booking.html" class="select-button" style="opacity: 1; transform: translateY(0);">選擇住宿日期</a>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <div class="card room-card text-white">
                            <img src="../pics_xhotel/皇家套房.png" class="card-img" alt="皇家套房">
                            <div class="card-img-overlay">
                                <h4 class="card-title room-title">皇家套房</h4>
                                <a href="./hotel-booking.html" class="select-button" style="opacity: 1; transform: translateY(0);">選擇住宿日期</a>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#roomCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#roomCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

        </div>
    </section>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
    // 登出函式
    function logout() {
        sessionStorage.removeItem('isLoggedIn');
        window.location.reload();
    }

    // 切換帳號函式
    function switchAccount() {
        sessionStorage.removeItem('isLoggedIn');
        window.location.href = 'hotel_login.html';
    }

    window.addEventListener('DOMContentLoaded', (event) => {
        const isLoggedIn = sessionStorage.getItem('isLoggedIn');
        
        // 【修正點 1】直接選取登入按鈕本身
        const loginButton = document.getElementById('login-button');

        if (isLoggedIn === 'true' && loginButton) {
            // 建立一個新的 div 作為下拉選單的容器
            // 將原按鈕的 margin 樣式加到新容器上，以維持排版
            const dropdownContainer = document.createElement('div');
            dropdownContainer.className = 'dropdown ms-lg-3';

            dropdownContainer.innerHTML = `
                <a href="#" class="btn btn-outline-brown dropdown-toggle" id="user-avatar-button" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="color: black;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                    </svg>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="user-avatar-button">
                    <li><a class="dropdown-item" href="./hotel_account.html">檢視/修改會員帳號</a></li>
                    <li><a class="dropdown-item" href="#" id="switch-account-btn">換另一個帳號</a></li>
                    <li><a class="dropdown-item" href="#" id="logout-btn">登出</a></li>
                </ul>
            `;
            
            // 用新的下拉選單元件「替換掉」舊的登入按鈕
            loginButton.replaceWith(dropdownContainer);

            // 為新的選項按鈕加上點擊事件
            document.getElementById('logout-btn').addEventListener('click', function(e) {
                e.preventDefault();
                logout();
            });

            document.getElementById('switch-account-btn').addEventListener('click', function(e) {
                e.preventDefault();
                switchAccount();
            });
        }
    });
</script>
</body>
</html>
