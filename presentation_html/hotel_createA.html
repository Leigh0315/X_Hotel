<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Hotel - 創建帳號</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body, html { height: 100%; margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; background-color: #8B7D74; padding: 20px 0; }
        .signup-container { background-color: white; padding: 40px 50px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); width: 100%; max-width: 600px; box-sizing: border-box; text-align: left; }
        .signup-container h1 { margin: 0; font-size: 24px; font-weight: bold; }
        .signup-container h1 a { text-decoration: none; color: #A98E81; }
        .signup-container h2 { margin-top: 5px; margin-bottom: 25px; font-size: 32px; font-weight: bold; }
        .input-field { width: 100%; padding: 12px; margin-bottom: 15px; border: none; background-color: #f0f0f0; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        .submit-btn { background-color: #A98E81; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; transition: background-color 0.3s; margin-top: 15px; }
        .submit-btn:hover { background-color: #8B7D74; }
    </style>
</head>

<body>

    <div class="signup-container">
        <!-- 【注意】這裡的 action 其實不會被執行，因為我們用 JavaScript 攔截了 -->
        <form id="signupForm" action="process_createA.php" method="POST">
            <h1><a href="./hotel_main.html">X-Hotel</a></h1>
            <h2>建立您的帳戶</h2>

            <div class="row">
                <div class="col-md-6">
                    <input type="text" id="lastName" name="lastName" class="input-field" placeholder="姓氏" required value="林">
                </div>
                <div class="col-md-6">
                    <input type="text" id="firstName" name="firstName" class="input-field" placeholder="名字" required value="小明">
                </div>
            </div>

            <input type="text" id="username" name="username" class="input-field" placeholder="帳號 (您的 Email)" required value="leighmingchin@gmail.com">
            <input type="password" id="password" name="password" class="input-field" placeholder="密碼" required >
            <input type="tel" id="phone" name="phone" class="input-field" placeholder="電話" required value="0912345678">
            <input type="text" id="address" name="address" class="input-field" placeholder="地址" required value="台北市信義區松信路60號">
            <input type="text" id="nationality" name="nationality" class="input-field" placeholder="國籍 (例如: 台灣)" required value="台灣">

            <button type="submit" class="submit-btn">創建帳號</button>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    
    <script>
        document.getElementById('signupForm').addEventListener('submit', function (event) {
            // 防止表單的預設送出行為
            event.preventDefault();

            const formData = new FormData(this);

            // 使用 fetch API 將資料送到後端 PHP
            fetch('process_createA.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                // 根據後端回傳的結果進行處理
                if (result.success) {
                    // 顯示後端傳來的成功訊息，例如 "註冊成功！驗證信已寄出..."
                    alert(result.message); 
                    
                    // 將頁面跳轉到您的首頁
                    window.location.href = 'http://localhost/S_presentation/presentation_html/hotel_main.html'; // 請確認這是您首頁的正確檔名
                } else {
                    // 如果後端顯示失敗，顯示後端傳來的錯誤訊息
                    alert('錯誤: ' + result.message);
                }
            })
            .catch(error => {
                // 處理網路錯誤或 JSON 解析錯誤
                console.error('提交錯誤:', error);
                alert('創建帳號時發生錯誤，請稍後再試。');
            });
        });
    </script>

</body>
</html>
